name: release

on:
  workflow_dispatch:
    inputs:
      note:
        description: 'Label for this run'
        required: false
        default: ''
      tag:
        description: 'Release tag'
        required: true
      overwrite:
        description: 'Overwrite existing release'
        type: boolean
        default: false

run-name: "${{ inputs.note || 'release' }}"

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      REPO: ${{ github.repository }}
      BRANCH: ${{ github.event.repository.default_branch }}
    steps:
      - name: Check existing release
        if: inputs.overwrite == false
        run: |
          if gh release view ${{ inputs.tag }} --repo $REPO 2>/dev/null; then
            echo "::error::Release ${{ inputs.tag }} already exists. Must have overwrite=true."
            exit 1
          fi

      - name: Check release to overwrite
        if: inputs.overwrite == true
        run: |
          if ! gh release view ${{ inputs.tag }} --repo $REPO &>/dev/null; then
            echo "::error::Release ${{ inputs.tag }} does not exist. Do not set overwrite=true."
            exit 1
          fi

      - name: Find latest successful build run
        run: |
          RUN_ID=$(gh run list --repo $REPO --workflow=build.yml --branch $BRANCH --status=success --limit=1 --json databaseId -q '.[0].databaseId')
          if [ -z "$RUN_ID" ]; then
            echo "::error::No successful build runs found."
            exit 1
          fi
          echo "RUN_ID=$RUN_ID" >> $GITHUB_ENV

      - name: Download asciiquarium.exe artifact
        run: |
          echo "Downloading from run $RUN_ID..."
          gh run download $RUN_ID --repo $REPO --name asciiquarium
          COMMIT_SHA=$(gh run view $RUN_ID --repo $REPO --json headSha -q .headSha)
          echo "COMMIT_SHA=$COMMIT_SHA" >> $GITHUB_ENV

      - name: Upload to existing release
        if: inputs.overwrite == true
        run: gh release upload ${{ inputs.tag }} asciiquarium.exe --clobber --repo $REPO

      - name: Create new release
        if: inputs.overwrite == false
        run: gh release create ${{ inputs.tag }} asciiquarium.exe --repo $REPO --title "${{ inputs.tag }}" --target $COMMIT_SHA --generate-notes

      - name: Checkout repo
        if: inputs.overwrite == true
        uses: actions/checkout@v6
        with:
          ref: ${{ env.COMMIT_SHA }}

      - name: Update tag to the build's commit
        if: inputs.overwrite == true
        run: |
          git tag -f ${{ inputs.tag }}
          git push origin ${{ inputs.tag }} --force
